server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    # keep redirects relative so the host's mapped port (e.g. :8080) survives
    absolute_redirect off;

    types {
        text/html html;
        text/css css;
        text/javascript js;
        application/xml urdf xml;
        model/stl stl;
    }

    location = / {
        return 302 /web/;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
